<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Water Quality Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">

 
  <style>
/* --- Custom Variables for Color Harmony --- */
:root {
    --primary-blue: #0d6efd;
    --primary-light-blue: #4da6ff;
    --background-start: #f5f7fa;
    --background-end: #c3cfe2;
    --text-dark: #2c3e50;
    --glass-color: rgba(255, 255, 255, 0.8);
    --glass-border: rgba(255, 255, 255, 0.4);
    --shadow-light: 0 4px 30px rgba(0, 0, 0, 0.05);
    --shadow-focus: 0 8px 15px rgba(13, 110, 253, 0.2);
}

/* --- Global Styling --- */
body {
    font-family: 'Poppins', sans-serif;
    /* Use a smoother, deeper gradient */
    background: linear-gradient(135deg, var(--background-start) 0%, #a1c4fd 100%); 
    min-height: 100vh;
    color: var(--text-dark);
    line-height: 1.6;
}
* {
    transition: all 0.3s ease-in-out; /* Smooth transitions everywhere */
}

/* --- Glass Navbar (Elevated Look) --- */
.navbar-glass {
    background: var(--glass-color);
    backdrop-filter: blur(15px); /* Increased blur for more glass effect */
    -webkit-backdrop-filter: blur(15px);
    border-bottom: 1px solid var(--glass-border);
    box-shadow: 0 6px 20px rgba(0, 0, 0, 0.1); /* Stronger overall shadow */
    padding: 1rem 0; /* Slightly more vertical padding */
}

.navbar-brand {
    font-weight: 700; /* Bolder brand name */
    font-size: 1.5rem;
    color: var(--primary-blue) !important;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    display: flex;
    align-items: center;
    gap: 12px;
}
.navbar-brand i {
    font-size: 1.8rem;
    color: var(--primary-light-blue);
    text-shadow: 0 0 5px rgba(0, 123, 255, 0.3); /* Soft glow on icon */
}

/* --- Search Inputs (Pill-shaped, Focused) --- */
.search-wrapper { position: relative; }

.modern-input {
    border-radius: 50px;
    border: 2px solid var(--glass-border); /* Thicker, softer border */
    background: white;
    padding-left: 45px;
    padding-right: 20px;
    box-shadow: 0 3px 8px rgba(0,0,0,0.05);
    min-width: 250px; /* Slightly wider input */
    height: 45px; /* Fixed height for consistency */
}

.modern-input:focus {
    box-shadow: var(--shadow-focus);
    border-color: var(--primary-blue);
    transform: translateY(-2px); /* Slightly more prominent lift */
}

.input-icon {
    left: 18px; /* Adjusted position to match padding */
    color: var(--text-dark); /* Darker icon for contrast */
    opacity: 0.6;
}

/* --- Search Results Dropdown (Clean and Layered) --- */
.list-group {
    margin-top: 10px;
    border-radius: 12px;
    box-shadow: 0 15px 35px rgba(0,0,0,0.15); /* Deeper shadow for "floating" effect */
    border: 1px solid var(--glass-border);
    overflow: hidden; /* Ensures border-radius applies to all list items */
}
.list-group-item {
    border-bottom: 1px solid #e0e0e0;
    padding: 12px 18px;
    background: rgba(255, 255, 255, 0.98);
    font-size: 0.95rem;
    color: var(--text-dark);
}
.list-group-item:hover {
    background-color: #e7f1ff;
    color: var(--primary-blue);
    transform: translateX(3px); /* Subtle slide to the right on hover */
}
.list-group-item:last-child {
    border-bottom: none;
}

/* --- Control Bar & Buttons (Distinct Micro-Interactions) --- */
.control-bar {
    margin-top: 3rem; /* More space from navbar */
    margin-bottom: 2rem;
    border-bottom: 2px solid rgba(0,0,0,0.08); /* More defined divider */
    padding-bottom: 1rem;
}

.btn-nav {
    border-radius: 50px;
    padding: 10px 25px; /* Larger hit area */
    font-size: 1rem;
    font-weight: 600;
    box-shadow: 0 4px 8px rgba(0,0,0,0.1);
}

/* Back Button: Soft and Recessed */
.btn-back {
    background: #ffffff;
    color: var(--text-dark);
    box-shadow: 0 2px 5px rgba(0,0,0,0.08), inset 0 0 5px rgba(0,0,0,0.05); /* Added inset shadow */
}
.btn-back:hover {
    background: #e9ecef;
    color: var(--primary-blue);
    transform: translateX(-5px); /* Stronger slide left */
}

/* Home Button: Vibrant and Lifting */
.btn-home {
    background: linear-gradient(135deg, var(--primary-blue) 0%, #0a58ca 100%);
    color: white;
    box-shadow: 0 6px 15px rgba(13, 110, 253, 0.4); /* Stronger primary shadow */
}
.btn-home:hover {
    background: linear-gradient(135deg, #0b5ed7 0%, #084298 100%);
    transform: scale(1.02); /* Scale up slightly */
    box-shadow: 0 8px 20px rgba(13, 110, 253, 0.5);
}

/* --- Content Animation (Already good) --- */
.main-content {
    animation: fadeIn 0.6s cubic-bezier(0.25, 0.46, 0.45, 0.94); /* Smoother animation curve */
}
/* Scrollbar styling remains effective */
  </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-glass sticky-top">
  <div class="container-fluid px-4">
    <a class="navbar-brand" href="{{ url_for('web.index') }}">
      <i class="fa-solid fa-droplet"></i> Water Quality
    </a>

    <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse justify-content-end" id="navbarContent">
      <div class="d-flex flex-wrap gap-3 mt-3 mt-lg-0">
        
        <!-- <div class="search-wrapper">
          <i class="fa-solid fa-satellite-dish input-icon"></i>
          <input id="searchStation" class="form-control modern-input" 
                 placeholder="Search Station..." autocomplete="off" onkeyup="searchStations()">
          <div id="station-results" class="list-group position-absolute w-100"></div>
        </div> -->
        <div class="search-wrapper">
          <i class="fa-solid fa-water input-icon"></i>
          <input id="searchRiver" class="form-control modern-input"
                placeholder="Search River..." autocomplete="off" onkeyup="searchRivers()">
          <div id="river-results" class="list-group position-absolute w-100 bg-white shadow"></div>
        </div>

        <div class="search-wrapper">
          <i class="fa-solid fa-map-location-dot input-icon"></i>
          <input id="searchState" class="form-control modern-input"
                placeholder="Search State..." autocomplete="off" onkeyup="searchStates()">
          <div id="state-results" class="list-group position-absolute w-100 bg-white shadow"></div>
        </div>


      </div>
    </div>
  </div>
</nav>

<div class="container main-content">

  <div class="d-flex justify-content-between align-items-center control-bar">
    
    <button class="btn-nav btn-back" onclick="history.back()">
      <i class="fa-solid fa-arrow-left"></i> Back
    </button>

    <a href="/" class="btn-nav btn-home">
      <i class="fa-solid fa-house"></i> Home
    </a>
    
  </div>

  {% block content %}{% endblock %}

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="{{ url_for('static', filename='js/search.js') }}"></script>
<script src="{{ url_for('static', filename='js/site.js') }}"></script>
<script>
  document.addEventListener("click", function(event) {
      if (!event.target.closest(".search-wrapper")) {
          document.getElementById("river-results").innerHTML = "";
          document.getElementById("state-results").innerHTML = "";
      }
  });
</script>
</body>
</html>
