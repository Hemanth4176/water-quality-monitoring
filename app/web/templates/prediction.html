<!-- app/web/templates/prediction.html -->
{% extends "base.html" %}
{% block content %}
<style>
/* --- Custom Variables for Earthy Green Palette --- */
:root {
    /* Assuming these are defined in base.html, keeping fallback */
    --primary-blue: #0d6efd; 
    --primary-light-blue: #4da6ff;
    --text-dark: #2c3e50; 

    /* New/Overridden variables for the table */
    --green-primary: #1e8449; /* Deep Earthy Green */
    --grey-background: #f8f9f7; /* Very light, soft grey background */
    --grey-border: #d5dbd9; /* Subtle border color */
}

/* --- Page Header --- */
h2 {
    font-size: 2.5rem;
    font-weight: 700;
    color: var(--text-dark);
    padding-bottom: 10px;
    border-bottom: 3px solid var(--primary-light-blue);
    margin-bottom: 30px;
}

/* --- Parameter Selection Dropdown --- */
#paramSelect {
    border-radius: 8px;
    border: 1px solid #ced4da;
    box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
    font-size: 1rem;
    padding: 10px 15px;
    width: 100% !important;
    max-width: 300px;
    transition: all 0.3s ease;
    background-color: #ffffff;
}

#paramSelect:focus {
    border-color: var(--primary-blue);
    box-shadow: 0 0 0 0.25rem rgba(13, 110, 253, 0.25);
}

/* --- Forecast Plot Section --- */
.plot-container {
    background-color: #ffffff;
    border-radius: 12px;
    box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
    padding: 20px;
    margin-top: 30px;
    border: 1px solid #e9ecef;
}

#forecastImg {
    max-width: 100%;
    height: auto;
    display: block;
    margin: 0 auto;
    border-radius: 8px;
}

/* --- Predicted Values Table (Earthy Green Theme) --- */
/* Override default Bootstrap styling */
.table-striped {
    --bs-table-striped-bg: var(--black-background); /* Soft grey stripe */
    --bs-table-striped-color: var(--text-dark);
}

#forecastTable {
    width: 100%;
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
    border: 1px solid var(--grey-border);
    margin-top: 20px;
    transition: all 0.3s ease;
}

#forecastTable th {
    background-color: var(--green-primary); /* Deep Green Header */
    color: white;
    font-weight: 600;
    padding: 12px 15px;
    text-align: left;
    border-color: var(--green-primary);
}

#forecastTable td {
    padding: 10px 15px;
    font-size: 0.95rem;
    color: var(--text-dark);
    border-color: #e9ecef;
}

#forecastTable tr:hover {
    background-color: #e8f5e9; /* Very light mint green background on hover */
    box-shadow: 0 2px 5px rgba(30, 132, 73, 0.1); /* Subtle green shadow on hover */
    transform: translateY(-1px); /* Slight lift on hover */
    cursor: default;
}

/* --- Media Queries for Responsiveness --- */
@media (max-width: 768px) {
    #paramSelect {
        max-width: 100%;
    }
}
</style>
<h2>Predict — {{ station.name }}</h2>
<select id="paramSelect" class="form-select w-25">
  <option value="pH">pH</option>
  <option value="DO_mg_L">DO</option>
  <option value="BOD_mg_L">BOD</option>
  <option value="nitrate_mg_L">Nitrate</option>
  <option value="conductivity_uScm">Conductivity</option>
</select>
<div class="mt-3">
  <img id="forecastImg" style="max-width:900px;width:100%;" alt="Forecast plot">
</div>
<div class="mt-3">
  <h5>Predicted values</h5>
  <table id="forecastTable" class="table table-striped"></table>
</div>

<script>
const stationName = "{{ station.name }}";
async function loadForecast(){
  const param = document.getElementById("paramSelect").value;
  const res = await fetch(`/api/station/${encodeURIComponent(stationName)}/predict/${param}`);
  const data = await res.json();
  if (data.error) {
    document.getElementById("forecastImg").alt = data.error;
    document.getElementById("forecastTable").innerHTML = "";
    return;
  }
  document.getElementById("forecastImg").src = data.image;
  let html = "<tr><th>Year</th><th>Value</th><th>Lower</th><th>Upper</th></tr>";
  (data.forecast || []).forEach(r => {
    html += `<tr><td>${r.ds}</td><td>${r.yhat.toFixed(3)}</td><td>${r.yhat_lower.toFixed(3)}</td><td>${r.yhat_upper.toFixed(3)}</td></tr>`;
  });
  document.getElementById("forecastTable").innerHTML = html;
}
document.getElementById("paramSelect").addEventListener("change", loadForecast);
loadForecast();
</script>
{% endblock %}
